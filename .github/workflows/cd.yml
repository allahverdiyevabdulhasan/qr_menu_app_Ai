name: CD Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run CD if tests pass (Assuming CI runs first or separately, but here we can just ensure it deploys on push)
    # If CI and CD are in the same workflow, it's easier to use 'needs'. 
    # Since they are separate, it will trigger on push.

    steps:
    - name: Deploy to Contabo Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /path/to/your/project
          git pull origin master
          docker-compose up -d --build
